plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

checkstyle {
    toolVersion = '10.21.4'
}

dependencies {
    String jUnitVersion = '5.10.2'
    String javaFxVersion = '17.0.7'

    // Include several OS classifiers so the fat JAR can start on common lab machines.
    String[] platforms = ['win', 'mac', 'mac-aarch64', 'linux']
    String[] javafxModules = ['base', 'graphics', 'controls', 'fxml']
    platforms.each { platform ->
        javafxModules.each { module ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
    workingDir = testRunDir
    doFirst {
        testRunDir.mkdirs()
        new File(testRunDir, 'data').mkdirs()
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions true
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    mainClass = 'seedu.budgie.Launcher'
}

shadowJar {
    archiveFileName = 'budgie.jar'
}

tasks.register('copyReleaseJar', Copy) {
    group = 'distribution'
    description = 'Copies the fat JAR to release/budgie.jar for submission.'
    dependsOn shadowJar
    from(shadowJar.archiveFile)
    into(layout.projectDirectory.dir('release'))
}

tasks.register('release') {
    group = 'distribution'
    description = 'Builds the fat JAR (with JavaFX) and copies it to release/budgie.jar.'
    dependsOn copyReleaseJar
}

run {
    standardInput = System.in
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the text-only CLI.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seedu.budgie.Budgie'
    standardInput = System.in
}

defaultTasks 'clean', 'test'
